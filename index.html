<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Bebop Links</title>

<style>
/* 全体 */
body {
  background: #000;
  color: #fff;
  margin: 0;
  padding: 0;
  font-family: "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  text-align: center;
}

/* カード */
.sns-card {
  width: 330px;
  margin: 40px auto;
  padding: 25px 20px;
  border-radius: 15px;
  background: #000;
  text-align: center;
  box-shadow: 0 0 15px #00ff8a33;
}

/* タイトル（発光強め） */
.sns-title {
  font-size: 32px;
  font-weight: 900;
  margin-bottom: 20px;
  color: #00ff8a;
  text-shadow:
      0 0 6px #00ff8a55,
      0 0 12px #00ff8a44,
      0 0 18px #00ff8a33;
}

/* 電話 & 住所（ボタンなし） */
.contact-line {
  display: flex;
  align-items: center;
  gap: 10px;
  justify-content: center;
  margin: 8px 0;
  color: #00ff8a;
  font-weight: 700;
  text-decoration: none;
  transition: 0.25s;
}

.contact-line:hover {
  color: #eafff4; /* ← 白寄りミント */
  text-shadow:
      0 0 3px #00ff8a,
      0 0 6px #00ff8a,
      0 0 10px #00ff8a;
}

/* SNS hover（ふち取り発光追加） */
.sns-item:hover {
  background: #111;
  box-shadow: 0 0 12px #00ff8a66;
  color: #eafff4;
  text-shadow:
      0 0 3px #00ff8a,
      0 0 6px #00ff8a,
      0 0 10px #00ff8a;
}

/* 電話/住所アイコン */
.contact-icon svg {
  width: 22px;
  height: 22px;
  fill: currentColor; /* ← text色に合わせて変わる！ */
}

/* SNSリンク部分 */
.sns-links {
  display: flex;
  flex-direction: column;
  gap: 15px;
  margin-top: 20px;
}

/* SNSボタン（最初のやつ） */
.sns-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 15px;
  border-radius: 10px;
  background: #0d0d0d;
  color: #00ff8a;
  font-weight: 700;
  text-decoration: none;
  transition: 0.2s;
  justify-content: flex-start;
}

/* SNSアイコン（緑） */
.sns-icon svg {
  width: 26px;
  height: 26px;
  fill: currentColor; /* ← text色に合わせて変わる！ */
}

/* SNS hover（ふんわり＋白っぽい色に） */
.sns-item:hover {
  background: #111;
  box-shadow: 0 0 12px #00ff8a66;
  color: #d9fff3; /* ← 明るく白寄り */
}
</style>
</head>

<body>

<div class="sns-card">

</html>
