<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Studio Bebop Links</title>
  <style>
    body {
      background-color: #0d0d0d;
      font-family: "Helvetica Neue", "Arial", sans-serif;
      text-align: center;
      padding: 60px 20px;
      color: #e0e0e0;
    }

    h1 {
      font-size: 36px;
      color: #00ff99;
      text-shadow: 0 0 10px #00ff99;
      margin-bottom: 50px;
      letter-spacing: 2px;
    }

    .link {
      display: inline-block;
      text-decoration: none;
      color: #00ff99;
      margin: 25px;
      transition: 0.3s;
      font-size: 18px;
    }

    .link img {
      width: 80px;
      height: 80px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0, 255, 153, 0.4);
      background-color: #111;
      padding: 10px;
      transition: 0.3s;
    }

    .link:hover img {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(0, 255, 153, 0.8);
    }

    footer {
      margin-top: 60px;
      color: #666;
      font-size: 14px;
      border-top: 1px solid #222;
      padding-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Studio Bebop SNS Links</h1>

  <a class="link" href="https://www.instagram.com/bebop_fukuoka/" target="_blank">

  </a>

  </a>
  <style>
@media (max-width: 600px) {
    .icon-container {
        flex-direction: column;
        align-items: center;
        gap: 30px;
    }
}
