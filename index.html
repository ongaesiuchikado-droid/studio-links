<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Bebop Links</title>

<style>
/* 全体 */
body {
  background: #000;
  color: #fff;
  margin: 0;
  padding: 0;
  font-family: "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  text-align: center;
}

/* カード */
.sns-card {
  width: 330px;
  margin: 40px auto;
  padding: 25px 20px;
  border-radius: 15px;
  background: #000;
  box-shadow: 0 0 15px #00ff8a33;
}

/* タイトル発光（強め）*/
.sns-title {
  font-size: 32px;
  font-weight: 900;
  margin-bottom: 25px;
  color: #00ff8a;
  text-shadow:
      0 0 7px #00ff8a88,
      0 0 14px #00ff8a66,
      0 0 20px #00ff8a55;
}

/* --- 電話・住所（背景なしの行） --- */
.info-line {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin: 10px 0 14px 0;
  text-decoration: none;
  color: #00ff8a;
  font-weight: 700;
  transition: 0.2s;
}

/* ⬇⬇⬇ さっき良かったアイコン（そのまま再現） ⬇⬇⬇ */
.info-line svg {
  width: 24px;
  height: 24px;
  fill: #00ff8a;
}

/* ホバーふんわり控えめ */
.info-line:hover {
  text-shadow: 0 0 6px #00ff8a55;
  transform: scale(1.02);
}

/* SNSリンク縦並び */
.sns-links {
  display: flex;
  flex-direction: column;
  gap: 15px;
  margin-top: 20px;
}

/* SNSボタン（最初のやつに完全戻し） */
.sns-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 15px;
  border-radius: 10px;
  background: #0d0d0d;
  color: #00ff8a;
  font-weight: 700;
  text-decoration: none;
  transition: 0.2s;
  justify-content: flex-start;
}

/* SNSアイコン（最初のデザイン） */
.sns-icon svg {
  width: 26px;
  height: 26px;
  fill: #00ff8a;
}

.sns-item:hover {
  background: #111;
  box-shadow: 0 0 12px #00ff8a66;
}
</style>
</head>

<body>

<div class="sns-card">

  <h1 class="sns-title">STUDIO BEBOP</h1>

</html>
