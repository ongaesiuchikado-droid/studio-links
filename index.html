<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Bebop Links</title>

<style>
/* 全体 */
body {
  background: #000;
  color: #fff;
  margin: 0;
  padding: 0;
  font-family: "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  text-align: center;
}

/* カード */
.sns-card {
  width: 330px;
  margin: 40px auto;
  padding: 25px 20px;
  border-radius: 15px;
  background: #000;
  text-align: center;
  box-shadow: 0 0 15px #00ff8a33;
}

/* タイトル発光（少し強め）*/
.sns-title {
  font-size: 32px;
  font-weight: 900;
  margin-bottom: 25px;
  color: #00ff8a; /* 緑 */
  text-shadow:
      0 0 6px #00ff8a55,
      0 0 10px #00ff8a44,
      0 0 14px #00ff8a33;  /* 少し強めの発光 */
}

/* SNSリンク縦並び */
.sns-links {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

/* SNSボタン */
.sns-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 15px;
  border-radius: 10px;
  background: #0d0d0d;
  color: #00ff8a;
  font-weight: 700;
  text-decoration: none;
  transition: 0.2s;
  justify-content: flex-start;
}

/* アイコン */
.sns-icon svg {
  width: 26px;
  height: 26px;
  fill: #00ff8a;
}

/* ホバー */
.sns-item:hover {
  background: #111;
  box-shadow: 0 0 12px #00ff8a66;
}
</style>
</head>

<body>

<div class="sns-card">

  <h1 class="sns-title">STUDIO BEBOP</h1>

  <div class="sns-links">

    <!-- Instagram -->
    <a href="https://www.instagram.com/___" class="sns-item">
      <span class="sns-icon">
        <svg viewBox="0 0 24 24"><path d="M7 2C4.243 2 2 4.243 2 7v10c0 2.757 2.243 5 5 5h10c2.757 0 5-2.243 5-5V7c0-2.757-2.243-5-5-5H7zm10 2c1.654 0 3 1.346 3 3v10c0 1.654-1.346 3-3 3H7c-1.654 0-3-1.346-3-3V7c0-1.654 1.346-3 3-3h10zM12 7a5 5 0 100 10 5 5 0 000-10zm5.5-.5a1.5 1.5 0 11-3 .001 1.5 1.5 0 013-.001z"/></svg>
      </span>
      Instagram
    </a>

    <!-- X (Twitter) -->
    <a href="https://x.com/___" class="sns-item">
      <span class="sns-icon">
        <svg viewBox="0 0 24 24"><path d="M18.146 2H21l-7.59 8.602L22 22h-7.184l-5.01-6.447L4.41 22H2l8.218-9.3L2 2h7.297l4.713 6.118L18.146 2z"/></svg>
      </span>
      X（Twitter）
    </a>

    <!-- YouTube -->
    <a href="https://youtube.com/___" class="sns-item">
      <span class="sns-icon">
        <svg viewBox="0 0 24 24"><path d="M21.8 8.001s-.2-1.403-.8-2.022c-.77-.814-1.635-.818-2.033-.866C15.733 5 12 5 12 5h-.014s-3.733 0-6.953.113c-.398.048-1.263.052-2.033.866-.6.619-.8 2.022-.8 2.022S2 9.748 2 11.494v1.009c0 1.746.2 3.493.2 3.493s.2 1.403.8 2.022c.77.814 1.78.789 2.228.875C7.267 19 12 19 12 19s3.733 0 6.953-.113c.398-.048 1.263-.052 2.033-.866.6-.619.8-2.022.8-2.022s.2-1.747.2-3.493v-1.009c0-1.746-.2-3.493-.2-3.493zM10 15.5v-6l5.5 3-5.5 3z"/></svg>
      </span>
      YouTube
    </a>

  </div>

</div>

</body>
</html>
