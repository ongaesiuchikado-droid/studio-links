<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Bebop Links</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
    background: #000;
    color: #fff;
    text-align: center;
    font-family: "Helvetica Neue", Arial, sans-serif;
}

/* タイトル発光 */
h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 38px;
    margin-top: 25px;
    color: #fff;
    text-shadow:
        0 0 4px #00ff66,
        0 0 8px #00ff66,
        0 0 12px #00ff66;
}

/* 電話番号・住所（テキストリンク） */
.info-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin: 8px 0;
    font-size: 18px;
    color: #00ff99;
    text-decoration: none;
    transition: 0.3s ease;
    white-space: nowrap; /* ← 改行を防ぐ */
}

.info-link:hover {
    color: #00ffcc;
    text-shadow:
        0 0 4px #00ff66,
        0 0 10px #00ff66,
        0 0 18px #00ff88; /* ← ふんわり光る */
}

.info-icon {
    font-size: 20px;
}

/* SNS ボタン（前のデザインを再現） */
.snscard {
    width: 80%;
    max-width: 300px;
    background: #111;
    border: 1px solid #00ff66;
    padding: 14px;
    border-radius: 10px;
    margin: 14px auto;
    transition: 0.3s ease;
    text-decoration: none;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 12px;
}

.snscard:hover {
    background: #00ff33;
    color: #000;
    transform: translateY(-3px);
}

.snscard i {
    font-size: 24px;
    color: #00ff99;
}

</style>

<script src="https://kit.fontawesome.com/a2e0e9c6c4.js" crossorigin="anonymous"></script>

</head>
<body>

<h1>STUDIO BEBOP</h1>

<!-- 電話 -->
<a href="tel:0929630895" class="info-link">
    <span class="info-icon"><i class="fa-solid fa-phone"></i></span>
    092-963-0895
</a>

<br>

<!-- 住所（スマホで改行しない & 光る） -->
<a href="https://maps.google.com/?q=福岡県糟屋郡新宮町上府北２丁目９−６０"
   class="info-link" target="_blank">
    <span class="info-icon"><i class="fa-solid fa-location-dot"></i></span>
    福岡県糟屋郡新宮町上府北２丁目９−６０
</a>

<!-- SNS -->
<a class="snscard" href="https://www.instagram.com/" target="_blank">
    <i class="fa-brands fa-instagram"></i>
    Instagram
</a>

<a class="snscard" href="https://x.com/" target="_blank">
    <i class="fa-brands fa-x-twitter"></i>
    X（旧Twitter）
</a>

<a class="snscard" href="#" target="_blank">
    <i class="fa-brands fa-youtube"></i>
    YouTube
</a>

</body>
</html>
