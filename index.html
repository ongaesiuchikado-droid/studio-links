<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Bebop Links</title>

<style>
body {
  background: #000;
  color: #fff;
  font-family: "Arial", sans-serif;
  text-align: center;
  padding: 40px 20px;
}

/* タイトル */
.title {
  font-size: 38px;
  margin-bottom: 30px;
  color: #00ff9d;
  text-shadow:
    0 0 8px rgba(0, 255, 157, 0.5),
    0 0 14px rgba(0, 255, 157, 0.3);
}

/* 電話・住所（シンプル行） */
.contact-item {
  display: flex;
  justify-content: center;
  align-items: center;
  margin-bottom: 14px;
  gap: 8px;
}

.contact-icon {
  font-size: 20px;
  color: #00ff9d;
}

/* リンクは文字だけ */
.contact-link {
  color: #00ff9d;
  font-size: 18px;
  font-weight: 600;
  text-decoration: none;
  transition: all 0.2s ease;
}

/* ホバー光（控えめ） */
.contact-link:hover {
  text-shadow: 0 0 6px rgba(0, 255, 157, 0.6);
}

/* SNS（ボタン表示） */
.sns {
  margin-top: 28px;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.sns-btn {
  display: inline-block;
  padding: 12px 20px;
  background: #00ff9d;
  color: #000;
  text-decoration: none;
  font-weight: bold;
  border-radius: 10px;
  transition: 0.2s ease;
}

.sns-btn:hover {
  background: #00e68c;
  transform: scale(1.05);
}
</style>

</head>
<body>

<h1 class="title">STUDIO BEBOP</h1>

<!-- 電話（文字だけリンク） -->
<div class="contact-item">
  <span class="contact-icon">☎️</span>
  <a href="tel:0929630895" class="contact-link">092-963-0895</a>
</div>

<!-- 住所（文字だけリンク） -->
<div class="contact-item">
  <span class="contact-icon">📍</span>
  <a
    href="https://maps.google.com/?q=福岡県糟屋郡新宮町上府北２丁目９−６０"
    class="contact-link"
    target="_blank"
  >
    福岡県糟屋郡新宮町上府北２丁目９−６０
  </a>
</div>

<!-- SNSリンク（ボタン） -->
<div class="sns">
  <a href="https://www.instagram.com/" class="sns-btn" target="_blank">Instagram</a>
  <a href="https://x.com/" class="sns-btn" target="_blank">X</a>
  <a href="https://youtube.com/" class="sns-btn" target="_blank">YouTube</a>
</div>

</body>
</html>
