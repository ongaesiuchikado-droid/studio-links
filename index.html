<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STUDIO BEBOP LINKS</title>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    /* ======== 全体 ======== */
    body {
      background: #000;
      margin: 0;
      padding: 0;
      font-family: "Josefin Sans", sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
    }

    .wrapper {
      width: 100%;
      max-width: 600px;
      padding: 25px 20px 60px;
    }

    /* ======== ロゴ部分 ======== */
    .logo-area {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo-area img {
      width: 200px;
      opacity: 0.9;
      filter: drop-shadow(0 0 8px rgba(0,255,180,0.3));
    }

    /* ======== SNS カード ======== */
    .link-card {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 18px 20px;
      border-radius: 12px;
      background: #111;
      border: 1px solid #222;
      margin-bottom: 18px;
      transition: 0.3s;
      cursor: pointer;
      text-decoration: none;
      color: #fff;
    }

    /* ホバーで光る */
    .link-card:hover {
      box-shadow: 0 0 18px rgba(0,255,180,0.35);
      border-color: rgba(0,255,180,0.6);
    }

    /* アイコン */
    .icon {
      width: 42px;
      height: 42px;
      transition: 0.3s;
    }

    /* ホバー時アイコン光る */
    .link-card:hover .icon {
      filter: drop-shadow(0 0 6px rgba(0,255,180,0.55));
    }

    /* テキスト */
    .text-block h3,
    .text-block p {
      margin: 0;
      text-shadow: 0 0 4px rgba(0,255,180,0.35);
      transition: 0.3s;
    }

    /* ホバー時テキスト光る */
    .link-card:hover h3,
    .link-card:hover p {
      text-shadow: 0 0 8px rgba(0,255,180,0.6);
    }

  </style>
</head>

<body>
  <div class="wrapper">

    <!-- ===== ロゴ（後で差し替えOK） ===== -->
    <div class="logo-area">
      <img src="logo.png" alt="STUDIO BEBOP LOGO">
    </div>

    <!-- ===== YouTube ===== -->
    <a href="#" class="link-card">
      <img src="youtube-icon.png" class="icon" alt="YouTube">
      <div class="text-block">
        <h3>YouTube</h3>
        <p>公式チャンネル</p>
      </div>
    </a>

    <!-- ===== Facebook ===== -->
    <a href="#" class="link-card">
      <img src="facebook-icon.png" class="icon" alt="Facebook">
      <div class="text-block">
        <h3>Facebook</h3>
        <p>公式ページ</p>
      </div>
    </a>

  </div>
</body>
</html>
