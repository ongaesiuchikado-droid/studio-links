<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Bebop Links</title>

<style>
/* 全体 */
body {
  background: #000;
  color: #fff;
  margin: 0;
  padding: 0;
  font-family: "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  text-align: center;
}

/* カード */
.sns-card {
  width: 330px;
  margin: 40px auto;
  padding: 25px 20px;
  border-radius: 15px;
  background: #000;
  text-align: center;
  box-shadow: 0 0 15px #00ff8a33;
}

/* タイトル（少し強めに発光） */
.sns-title {
  font-size: 32px;
  font-weight: 900;
  margin-bottom: 25px;
  color: #00ff8a;
  text-shadow:
      0 0 6px #00ff8a77,
      0 0 12px #00ff8a55,
      0 0 16px #00ff8a44;
}

/* SNSリンク縦並び */
.sns-links {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* SNSボタン（共通） */
.sns-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 15px;
  border-radius: 10px;
  background: #0d0d0d;
  color: #00ff8a;
  font-weight: 700;
  text-decoration: none;
  transition: 0.25s;
  justify-content: flex-start;
}

/* 丸型アイコン（SNS/電話/住所共通） */
.sns-icon {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  border: 1px solid #00ff8aaa;
  background: #00ff8a11;
  transition: 0.25s;
}

.sns-icon svg {
  width: 22px;
  height: 22px;
  fill: none;
  stroke: #00ff8a;
  stroke-width: 2;
}

/* ホバー（控えめにふんわり光る） */
.sns-item:hover .sns-icon {
  box-shadow:
    0 0 6px #00ff8a55,
    0 0 10px #00ff8a33;
  background: #00ff8a22;
}

.sns-item:hover {
  background: #111;
}

/* 住所のテキスト少し太め */
.address-text {
  font-weight: 800;
  letter-spacing: 0.5px;
}
</style>
</head>

<body>

<div class="sns-card">

  <h1 class="sns-title">STUDIO BEBOP</h1>

  <div class="sns-links">

    <!-- Instagram -->

</body>
</html>
