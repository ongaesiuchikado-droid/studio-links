<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Bebop Links</title>

<style>
/* ===== 全体 ===== */
body {
  background: #000;
  color: #fff;
  margin: 0;
  padding: 0;
  font-family: "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  text-align: center;
}

/* ===== カード ===== */
.sns-card {
  width: 330px;
  margin: 40px auto;
  padding: 25px 20px;
  border-radius: 15px;
  background: #000;
  text-align: center;
  box-shadow: 0 0 15px #00ff8a33;
}

/* ===== タイトル（強め発光） ===== */
.sns-title {
  font-size: 32px;
  font-weight: 900;
  margin-bottom: 25px;
  color: #00ff8a;
  text-shadow:
      0 0 6px #00ff8a88,
      0 0 12px #00ff8a66,
      0 0 18px #00ff8a44;
}

/* ===== SNSリンク縦並び ===== */
.sns-links {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

/* ===== SNSボタン ===== */
.sns-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 15px;
  border-radius: 10px;
  background: #0d0d0d;
  color: #00ff8a;
  font-weight: 700;
  text-decoration: none;
  transition: 0.2s;
  justify-content: center; /* ←アイコン＋文字を中央揃え */
}

/* アイコン */
.sns-icon svg {
  width: 26px;
  height: 26px;
  fill: #00ff8a;
}

/* ホバー */
.sns-item:hover {
  background: #111;
  box-shadow: 0 0 12px #00ff8a55;
}

/* ===== 電話番号・住所（SNS風デザイン） ===== */
.info-link {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;

  background: #0d0d0d;
  padding: 12px 15px;
  border-radius: 10px;

  color: #00ff8a;
  text-decoration: none;
  font-size: 15px;
  font-weight: 700;

  transition: 0.25s;
  box-shadow: 0 0 0px #00ff8a22;
}

/* ホバー控えめ発光 */
.info-link:hover {
  background: #111;
  box-shadow: 0 0 8px #00ff8a44;
}

/* 電話 & マップのアイコン */
.info-icon {
  width: 26px;
  height: 26px;
  fill: #00ff8a;
  flex-shrink: 0;
}

/* 住所だけ行間調整 */
.address-text {
  line-height: 1.35;
}
</style>
</head>

<body>

<div class="sns-card">

  <!-- タイトル -->
  <h1 class="sns-title">STUDIO BEBOP</h1>

  <!-- 電話番号 -->
  <a href="tel:0929630895" class="info-link">
    <svg class="info-icon" viewBox="0 0 24 24">
      <path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24 11.36 11.36 0 003.56.57 1 1 0 011 1v3.61a1 1 0 01-.88 1 19.91 19.91 0 01-8.67-2.52A19.45 19.45 0 013.59 7.5 19.91 19.91 0 011.07-1.17 1 1 0 012.05.07h3.61a1 1 0 011 1 11.36 11.36 0 00.57 3.56 1 1 0 01-.24 1.01l-2.37 2.15z"/>
    </svg>
    092-963-0895
  </a>

  <!-- 住所（Google Mapsへリンク） -->
  <a href="https://www.google.com/maps/search/?api=1&query=福岡県糟屋郡新宮町上府北２丁目９−６０"
     class="info-link" target="_blank">
    <svg class="info-icon" viewBox="0 0 24 24">
      <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5s2.5 1.12 2.5 2.5S13.38 11.5 12 11.5z"/>
    </svg>
    <span class="address-text">
      福岡県糟屋郡新宮町<br>上府北２丁目９−６０
    </span>

  <!-- SNSリンク一覧 -->
  <div class="sns-links">

        <svg viewBox="0 0 24 24"><path d="M7 2C4.243 2 2 4.243 2 7v10c0 2.757 2.243 5 5 5h10c2.757 0 5-2.243 5-5V7c0-2.757-2.243-5-5-5H7zm10 2c1.654 0 3 1.346 3 3v10c0 1.654-1.346 3-3 3H7c-1.654 0-3-1.346-3-3V7c0-1.654 1.346-3 3-3h10zM12 7a5 5 0 100 10 5 5 0 000-10zm5.5-.5a1.5 1.5 0 11-3 .001 1.5 1.5 0 013-.001z"/></svg>

  </div>

</div>

</body>
</html>
