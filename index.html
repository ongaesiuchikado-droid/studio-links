<!DOCTYPE html>
<html lang="ja">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Bebop Links</title>

<style>
body {
    background: #000;
    color: #fff;
    text-align: center;
    font-family: "Helvetica Neue", Arial, sans-serif;
}
    .glow-green {
  font-family: 'Orbitron', sans-serif;
  color: #ffffff;
  font-weight: 700;
  text-shadow:
    0 0 5px #00ff66,
    0 0 10px #00ff66,
    0 0 20px #00ff66,
    0 0 30px #00ff66,
    0 0 40px #00ff66;
}

/* カード全体 */
.profile-card {
    margin: 40px auto;
    background: #111;
    padding: 30px;
    border-radius: 20px;
    width: 90%;
    max-width: 420px;
    box-shadow: 0 0 20px #0f0;
}

/* ロゴ（丸枠） */
.logo-circle {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    overflow: hidden;
    margin: 0 auto 15px;
    border: 4px solid #0f0;
}

.logo-circle img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* “Studio Bebop” の文字 */
.studio-name {
    font-size: 28px;
    margin-bottom: 5px;
    color: #0f0;
}

/* 電話番号リンク */
.phone {
    font-size: 18px;
    margin-bottom: 25px;
}

.phone a {
    color: #0f0;
    text-decoration: none;
    font-weight: bold;
}

/* SNS アイコンの並び */
.icon-container {
    display: flex;
    justify-content: center;
    gap: 40px;
    flex-wrap: wrap;
}

/* アイコン1個あたり */
.icon-box {
    text-align: center;
}

.icon-box img {
    width: 70px;
    border-radius: 15px;
    padding: 10px;
    background: #111;
    box-shadow: 0 0 10px #0f0;
}

.icon-box span {
    display: block;
    margin-top: 8px;
    font-size: 14px;
}

/* スマホ縦並び */
@media (max-width: 600px) {
    .icon-container {
        flex-direction: column;
        gap: 25px;
    }

    .icon-box img {
        width: 90px;
    }
}
</style>
</head>

<body>

<div class="profile-card">

    <!-- ロゴ丸アイコン -->
    <div class="logo-circle">
        <img src="logo.png" alt="Studio Bebop Logo">
    </div>

    <!-- 店名 -->
    <div class="studio-name">Studio Bebop</div>

    <!-- 電話番号（タップで発信） -->
    <div class="phone">
        <a href="tel:090-0000-0000">📞 090-0000-0000</a>
    </div>

    <!-- SNS リンク -->
    <div class="icon-container">

        <div class="icon-box">
            <a href="https://instagram.com/___">
                <img src="insta.png" alt="Instagram">
            </a>
            <span>Instagram</span>
        </div>

        <div class="icon-box">
            <a href="https://twitter.com/___">
                <img src="x.png" alt="X">
            </a>
            <span>X (Twitter)</span>
        </div>

        <div class="icon-box">
            <a href="https://youtube.com/___">
                <img src="youtube.png" alt="YouTube">
            </a>
            <span>YouTube</span>
        </div>

    </div>

</div>

</body>
</html>
